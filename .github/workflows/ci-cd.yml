name: CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  APP_NAME: mobile-banking-backend
  IMAGE_TAG: ${{ github.run_number }}
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: banking-devops-eks
  ECR_REPOSITORY: banking-devops/mobile-banking-backend

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest bandit pip-audit

      - name: Unit tests
        run: pytest app/test_app.py -q

      - name: SAST scan (Bandit)
        run: bandit -r app -x app/test_app.py -lll

      - name: Dependency scan (pip-audit)
        run: pip-audit -r app/requirements.txt

  build-scan-image:
    runs-on: ubuntu-latest
    needs: test-and-security
    outputs:
      image_uri: ${{ steps.image-meta.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image reference
        id: image-meta
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            REPO="${{ vars.ECR_REPOSITORY || env.ECR_REPOSITORY }}"
            IMAGE_URI="${REGISTRY}/${REPO}:${{ env.IMAGE_TAG }}"
          else
            IMAGE_URI="${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}"
          fi
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image-meta.outputs.image_uri }}
          load: true

      - name: Scan image (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.1 image --exit-code 1 --severity HIGH,CRITICAL ${{ steps.image-meta.outputs.image_uri }}

  deploy-eks:
    runs-on: ubuntu-latest
    needs: build-scan-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME || env.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION || env.AWS_REGION }}"

      - name: Validate Kubernetes manifests
        run: |
          sed "s|REPLACE_WITH_IMAGE|${{ needs.build-scan-image.outputs.image_uri }}|g" k8s/deployment.yaml > deployment.rendered.yaml
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f deployment.rendered.yaml
          kubectl apply --dry-run=client -f k8s/service.yaml
          kubectl apply --dry-run=client -f k8s/networkpolicy.yaml
          kubectl apply --dry-run=client -f k8s/hpa.yaml
          kubectl apply --dry-run=client -f k8s/ingress.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/namespace.yaml
          if kubectl api-resources --api-group=cert-manager.io | grep -q '^clusterissuers'; then
            kubectl apply -f k8s/cert-issuer.yaml
          fi
          sed "s|REPLACE_WITH_IMAGE|${{ needs.build-scan-image.outputs.image_uri }}|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/networkpolicy.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl -n banking rollout status deployment/banking-backend --timeout=300s

      - name: Post-deploy smoke check
        run: |
          kubectl -n banking get deploy banking-backend
          kubectl -n banking get pods -l app=banking-backend
          kubectl -n banking get svc banking-backend-service
          kubectl -n banking get ingress banking-backend-ingress || true
