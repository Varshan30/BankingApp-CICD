grafana:
  enabled: true
  adminPassword: CHANGE_ME_GRAFANA_ADMIN_PASSWORD
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - grafana.bank.example.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.bank.example.com

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 2

prometheus:
  prometheusSpec:
    replicas: 2
    retention: 15d
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
